packages:
  - "apps/*"
  - "packages/*"
  - "templates"

allowBuilds:
  electron: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.110'
  - '@ai-sdk/provider-utils@5.0.58'
  - '@ai-sdk/provider@4.0.26'
  - ai@7.0.136

onlyBuiltDependencies:
  - electron
  - esbuild
  - msgpackr-extract
